name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
                        dist/github-contribution-grid-snake.svg?color_snake=#111111&color_dots=#EBE8E2,#F8C99A,#F5A25A,#E8620A,#9A4208
                        dist/github-contribution-grid-snake-dark.svg?color_snake=#F4F1EA&color_dots=#1A1714,#4A2A10,#8A4510,#D8640F,#FF9A3C

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
